# Repo DNA — standalone runner.
# Other people use this. a private OS dashboard is not required.
#
# From this repo: Actions → Repo DNA → Run workflow → owner/repo
# From another repo:
#   jobs:
#     dna:
#       uses: example-owner/repo-dna-system/.github/workflows/dna.yml@main
#       with:
#         target: owner/repo
#       secrets:
#         DNA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#
# Public targets work with the default token.
# Private targets need a PAT (repo scope) in DNA_GITHUB_TOKEN.
# Artifacts expire. Copy them into your own store if you want them to last.
# This workflow never writes live README.md and never pushes to the target.

name: Repo DNA

on:
  workflow_dispatch:
    inputs:
      target:
        description: "owner/repo to fingerprint"
        required: true
        type: string
      branch:
        description: "branch (default main)"
        required: false
        default: "main"
        type: string
  workflow_call:
    inputs:
      target:
        description: "owner/repo to fingerprint"
        required: true
        type: string
      branch:
        required: false
        type: string
        default: "main"
    secrets:
      DNA_GITHUB_TOKEN:
        required: false

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout DNA library
        uses: actions/checkout@v4

      - name: Run orchestrator v2
        env:
          GITHUB_TOKEN: ${{ secrets.DNA_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target }}"
          BRANCH="${{ inputs.branch }}"
          if [[ ! "$TARGET" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "target must be owner/repo" >&2
            exit 1
          fi
          OWNER="${TARGET%/*}"
          REPO="${TARGET#*/}"
          chmod +x orchestrator.sh
          ./orchestrator.sh "$OWNER" "$REPO" "$BRANCH"

      - name: Upload fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dna-extract
          path: dna-extracts/
          if-no-files-found: warn
          retention-days: 30

      # Artifacts above expire in 30 days. This step makes the run durable:
      # it pushes the same output straight into the private results vault.
      # Runs only when a vault push token is configured — forks and callers
      # without DNA_VAULT_TOKEN just keep the artifact-only behavior above.
      - name: Commit results into vault
        if: always()
        env:
          VAULT_TOKEN: ${{ secrets.DNA_VAULT_TOKEN }}
          VAULT_REPO: ${{ vars.DNA_VAULT_REPO }}
        run: |
          set -euo pipefail
          : "${VAULT_REPO:=byfanzoftheone-stack/repo-dna-results}"
          if [[ -z "${VAULT_TOKEN:-}" ]]; then
            echo "DNA_VAULT_TOKEN not set — skipping vault commit. Results only live in the 30-day artifact above." >&2
            exit 0
          fi
          if [[ ! -d dna-extracts ]]; then
            echo "No dna-extracts/ produced — nothing to commit." >&2
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${VAULT_TOKEN}@github.com/${VAULT_REPO}.git" vault
          mkdir -p vault/extracts
          cp -r dna-extracts/. vault/extracts/
          python3 scripts/rebuild_vault_inventory.py vault
          cd vault
          git config user.name "repo-dna-bot"
          git config user.email "dna-bot@users.noreply.github.com"
          git add extracts INVENTORY.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "dna: refresh extract for ${{ inputs.target }}"
          git push origin HEAD:main
