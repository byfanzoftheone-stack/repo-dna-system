# Repo DNA — standalone runner.
# Other people use this. a private OS dashboard is not required.
#
# From this repo: Actions → Repo DNA → Run workflow → owner/repo
# From another repo:
#   jobs:
#     dna:
#       uses: byfanzoftheone-stack/repo-dna-system/.github/workflows/dna.yml@main
#       with:
#         target: owner/repo
#       secrets:
#         DNA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#
# Public targets work with the default token.
# Private targets need a PAT (repo scope) in DNA_GITHUB_TOKEN.
# Artifacts expire. Copy them into your own store if you want them to last.
# This workflow never writes live README.md and never pushes to the target.

name: Repo DNA

on:
  workflow_dispatch:
    inputs:
      target:
        description: "owner/repo to fingerprint"
        required: true
        type: string
      branch:
        description: "branch (default main)"
        required: false
        default: "main"
        type: string
  workflow_call:
    inputs:
      target:
        description: "owner/repo to fingerprint"
        required: true
        type: string
      branch:
        required: false
        type: string
        default: "main"
    secrets:
      DNA_GITHUB_TOKEN:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout DNA library
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Always this repo, even when another repo calls this workflow.
          repository: byfanzoftheone-stack/repo-dna-system
          persist-credentials: false
      - name: Input-safety regression tests
        run: bash tests/test_validate_inputs.sh
      - name: End-to-end scan against offline fixture API
        run: bash tests/test_orchestrator_fixtures.sh

  extract:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout DNA library
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: byfanzoftheone-stack/repo-dna-system
          persist-credentials: false

      - name: Run orchestrator v2
        env:
          GITHUB_TOKEN: ${{ secrets.DNA_GITHUB_TOKEN || github.token }}
          # Inputs travel as data in env vars, never pasted into script text.
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          PARTS="$(bash scripts/validate_inputs.sh "$INPUT_TARGET" "$INPUT_BRANCH")"
          read -r OWNER REPO BRANCH <<< "$PARTS"
          chmod +x orchestrator.sh
          ./orchestrator.sh "$OWNER" "$REPO" "$BRANCH"

      - name: Upload fingerprints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dna-extract
          path: dna-extracts/
          if-no-files-found: warn
          retention-days: 30

  # Separate job on a fresh runner: the vault push token never shares a
  # machine with the scan. Runs only when DNA_VAULT_TOKEN is configured —
  # forks and callers without it keep the 30-day artifact only.
  vault:
    needs: extract
    if: ${{ !cancelled() && needs.extract.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout DNA library
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: byfanzoftheone-stack/repo-dna-system
          persist-credentials: false

      - name: Download fingerprints
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dna-extract
          path: dna-extracts/

      - name: Commit results into vault
        env:
          VAULT_TOKEN: ${{ secrets.DNA_VAULT_TOKEN }}
          VAULT_REPO: ${{ vars.DNA_VAULT_REPO }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          : "${VAULT_REPO:=byfanzoftheone-stack/repo-dna-results}"
          if [[ -z "${VAULT_TOKEN:-}" ]]; then
            echo "DNA_VAULT_TOKEN not set — skipping vault commit. Results only live in the 30-day artifact." >&2
            exit 0
          fi
          if [[ ! -d dna-extracts ]] || [[ -z "$(ls -A dna-extracts)" ]]; then
            echo "No fingerprints produced — nothing to commit." >&2
            exit 0
          fi
          # Validate while still in the repo root, where the script lives.
          PARTS="$(bash scripts/validate_inputs.sh "$INPUT_TARGET" "$INPUT_BRANCH")"
          read -r OWNER REPO _ <<< "$PARTS"
          git clone --depth 1 "https://x-access-token:${VAULT_TOKEN}@github.com/${VAULT_REPO}.git" vault
          mkdir -p vault/extracts
          cp -r dna-extracts/. vault/extracts/
          python3 scripts/rebuild_vault_inventory.py vault
          cd vault
          git config user.name "repo-dna-bot"
          git config user.email "dna-bot@users.noreply.github.com"
          git add extracts INVENTORY.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "dna: refresh extract for ${OWNER}/${REPO}"
          git push origin HEAD:main
